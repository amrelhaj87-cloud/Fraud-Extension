<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch now (demo)</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #4a4a4a; font: 16px/1.5 Arial, sans-serif; }
    .demo-tag { position: fixed; top: 10px; left: 10px; background: #fef3c7; color: #92400e; padding: 2px 10px; border-radius: 6px; font-size: 12px; }
    .player { width: min(860px, 94vw); aspect-ratio: 16 / 9; background: #000; position: relative; display: grid; place-items: center; }
    .box { background: #f2f2f2; padding: 22px; width: min(420px, 86%); border-radius: 4px; }
    h2 { margin: 0 0 8px; font-size: 22px; }
    .row { display: flex; gap: 10px; margin-top: 14px; }
    .cc { border: 1px solid #1fb5ad; border-radius: 6px; padding: 10px 14px; background: #fff; }
    input { flex: 1; min-width: 0; border: 1px solid #1fb5ad; border-radius: 6px; padding: 10px; font-size: 18px; }
    button { margin-top: 14px; width: 100%; padding: 10px; border: 0; border-radius: 6px; background: #1fb5ad; color: #fff; font-size: 16px; }
  </style>
</head>
<body>
  <span class="demo-tag">Demo page: harmless copy of a mobile-billing subscription scam</span>
  <div class="player">
    <div class="box">
      <h2>Confirm That You Are Not a Robot</h2>
      <div>Enter your mobile number to confirm you are not a robot.</div>
      <div class="row">
        <span class="cc">+971</span>
        <input type="tel" placeholder="Phone number">
      </div>
      <button type="button">Continue</button>
    </div>
  </div>
</body>
</html>
