<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Just a moment... (demo)</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111; color: #ddd; font: 15px/1.5 "Segoe UI", Arial, sans-serif; }
    .demo-tag { position: fixed; top: 10px; left: 10px; background: #fef3c7; color: #92400e; padding: 2px 10px; border-radius: 6px; font-size: 12px; }
    .card { width: min(500px, 92vw); background: #2b2b2b; border-radius: 10px; overflow: hidden; }
    .head { background: linear-gradient(90deg, #f48120, #f6a03a); color: #fff; padding: 16px 22px; }
    .head h2 { margin: 0; font-size: 20px; }
    ol { margin: 0; padding: 18px 22px 18px 40px; }
    li { background: #383838; margin: 8px 0; padding: 10px 12px; border-radius: 6px; }
    kbd { background: #5a4632; color: #f6a03a; border-radius: 4px; padding: 1px 7px; font-family: inherit; }
    .id { text-align: center; color: #888; font-size: 12px; padding-bottom: 14px; }
  </style>
</head>
<body>
  <span class="demo-tag">Demo page: harmless copy of a ClickFix fake verification (nothing is copied)</span>
  <div class="card">
    <div class="head">
      <h2>Human Verification</h2>
      <div>Complete the steps below to verify you are human</div>
    </div>
    <ol>
      <li>Press <kbd>Win</kbd> + <kbd>R</kbd></li>
      <li>Type <kbd>cmd</kbd> in the input box and press <kbd>Enter</kbd></li>
      <li>Press <kbd>Ctrl</kbd> + <kbd>V</kbd></li>
      <li>Press <kbd>Enter</kbd></li>
    </ol>
    <div class="id">Verification ID: 000000 (demo)</div>
  </div>
</body>
</html>
