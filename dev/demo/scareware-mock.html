<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Security alert (demo)</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f4f6; font: 16px/1.5 "Segoe UI", Arial, sans-serif; }
    .demo-tag { position: fixed; top: 10px; left: 10px; background: #fef3c7; color: #92400e; padding: 2px 10px; border-radius: 6px; font-size: 12px; }
    .start { padding: 14px 26px; font-size: 18px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
    #screen { display: none; position: fixed; inset: 0; background: #0a5bc4; color: #fff; padding: 8vh 8vw; }
    #screen.on { display: block; }
    #screen h1 { font-size: 34px; margin: 0 0 14px; }
    .phone { font-size: 30px; font-weight: 700; background: #fff; color: #0a5bc4; display: inline-block; padding: 6px 16px; border-radius: 6px; margin-top: 12px; }
  </style>
</head>
<body>
  <span class="demo-tag">Demo page: harmless copy of a fake "tech support" scareware page</span>
  <button class="start" id="start" type="button">Start demo (opens fullscreen)</button>

  <div id="screen">
    <h1>⚠ Windows Defender Security Alert</h1>
    <p>Your computer has been blocked due to suspicious activity. Your bank details and UAE PASS may be at risk.</p>
    <p>Do not restart your computer. Call Microsoft Support immediately:</p>
    <div class="phone">800 000 0000 (demo)</div>
  </div>

  <script>
    document.getElementById("start").addEventListener("click", async () => {
      const screen = document.getElementById("screen");
      screen.classList.add("on");
      try { await document.documentElement.requestFullscreen(); } catch (e) {}
      try { if (navigator.keyboard && navigator.keyboard.lock) await navigator.keyboard.lock(); } catch (e) {}
    });
  </script>
</body>
</html>
