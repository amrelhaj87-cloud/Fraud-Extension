<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UAE PASS - Sign in (demo)</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef1f4; font: 16px/1.5 Arial, sans-serif; color: #1f2937; }
    .demo-tag { position: fixed; top: 10px; left: 10px; background: #fef3c7; color: #92400e; padding: 2px 10px; border-radius: 6px; font-size: 12px; }
    .box { background: #fff; padding: 28px; width: min(400px, 88vw); border-radius: 10px; box-shadow: 0 4px 18px rgba(0,0,0,.08); }
    h1 { margin: 0 0 4px; font-size: 24px; }
    p { margin: 0 0 18px; color: #6b7280; font-size: 14px; }
    label { display: block; margin: 12px 0 4px; font-size: 14px; }
    input { box-sizing: border-box; width: 100%; border: 1px solid #cbd5e1; border-radius: 6px; padding: 10px; font-size: 16px; }
    button { margin-top: 18px; width: 100%; padding: 11px; border: 0; border-radius: 6px; background: #374151; color: #fff; font-size: 16px; }
  </style>
</head>
<body>
  <span class="demo-tag">Demo page: harmless copy of a fake UAE PASS sign-in. Nothing is sent anywhere.</span>
  <div class="box">
    <h1>UAE PASS</h1>
    <p>Your traffic fine is overdue. Sign in to verify your identity and avoid a penalty.</p>
    <label for="eid">Emirates ID</label>
    <input id="eid" name="emirates_id" placeholder="784-XXXX-XXXXXXX-X" autocomplete="off">
    <label for="otp">Verification code (OTP)</label>
    <input id="otp" name="otp" inputmode="numeric" placeholder="6-digit code" autocomplete="off">
    <button type="button">Sign in</button>
  </div>
</body>
</html>
