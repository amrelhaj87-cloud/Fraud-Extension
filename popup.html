<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>FraudShield</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <img src="icons/icon48.png" alt="" width="24" height="24">
    <div class="top-text">
      <h1>FraudShield <span class="version" id="version"></span></h1>
      <p class="tagline" data-i18n="tagline"></p>
    </div>
    <div class="lang" role="group" aria-label="Language / اللغة">
      <button type="button" data-lang="ar" lang="ar">ع</button>
      <button type="button" data-lang="en" lang="en">EN</button>
    </div>
  </header>

  <section class="card" id="current" aria-live="polite">
    <div class="card-label" id="current-title" data-i18n="current"></div>
    <div class="host" id="current-host" dir="ltr">…</div>
    <div class="verdict" id="current-verdict" hidden>
      <div class="verdict-row">
        <span class="pill" id="current-level"></span>
        <span class="score" id="current-score"></span>
      </div>
      <div class="bar"><div class="bar-fill" id="current-bar"></div></div>
      <ul class="reasons" id="current-reasons"></ul>
      <div class="age" id="current-age"></div>
      <button type="button" class="report-btn" id="report-current" data-i18n="reportSite" hidden></button>
    </div>
    <div class="note" id="current-note" hidden></div>
  </section>

  <label class="toggle">
    <input type="checkbox" id="block-toggle" checked>
    <span data-i18n="blockToggle"></span>
  </label>

  <form class="check" id="check-form" autocomplete="off">
    <label for="check-input" class="card-label" data-i18n="checkLabel"></label>
    <div class="check-row">
      <input id="check-input" type="text" dir="ltr" data-i18n-placeholder="checkPlaceholder" spellcheck="false">
      <button type="submit" id="check-btn" data-i18n="checkBtn"></button>
    </div>
  </form>

  <section class="page-results">
    <div class="card-label"><span data-i18n="pageResults"></span> <span id="results-count"></span></div>
    <ul class="results" id="results"></ul>
    <div class="note" id="results-empty" data-i18n="emptyResults"></div>
  </section>

  <div class="note hint" id="reload-hint" data-i18n="reloadHint" hidden></div>

  <div class="account-row">
    <span id="account-line"></span>
    <span class="account-actions">
      <button type="button" class="link" id="my-reports" data-i18n="myReports"></button>
      <button type="button" class="link" id="sign-out" data-i18n="rSignOut" hidden></button>
    </span>
  </div>

  <footer class="foot" data-i18n="footer"></footer>

  <script src="i18n.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
